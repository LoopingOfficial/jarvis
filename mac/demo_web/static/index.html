<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS — Interface holographique</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <canvas id="network"></canvas>
  <div id="avatar"></div>
  <div class="scanline" id="scanline"></div>

  <div class="hud top">
    <div class="brand">J A R V I S</div>
    <div class="sub">Holographic assistant · edge-tts</div>
  </div>

  <div class="status" id="status">system idle</div>

  <div class="hud console">
    <input id="prompt" autocomplete="off" placeholder="Texte à prononcer par JARVIS…"
           value="Bonjour Monsieur. Tous les systèmes sont opérationnels.">
    <button id="speak">Parler</button>
    <button id="check" class="accent">Check System</button>
  </div>

  <aside class="report" id="report">
    <h2>System report</h2>
    <div class="summary" id="reportSummary"></div>
    <ul id="reportList"></ul>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/static/network.js"></script>
  <script src="/static/avatar.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
