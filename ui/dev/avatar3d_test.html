<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JarvisAvatar3D — banc de test</title></head>
<body style="margin:0;background:#05080f;overflow:hidden">
<canvas id="c" style="width:100vw;height:100vh;display:block"></canvas>
<div id="fb" hidden style="position:fixed;inset:0;color:#8af;font:14px monospace;padding:20px">Fallback WebGL</div>
<pre id="hud" style="position:fixed;top:8px;left:8px;background:#0b1220;color:#7dd3fc;font:11px/1.5 monospace;padding:10px;border-radius:6px;max-height:96vh;overflow:auto;z-index:9"></pre>
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/" } }
</script>
<script type="module">
import { JarvisAvatar3D } from '../js/avatar/jarvis_avatar_3d.js';

const hud = document.getElementById('hud');
const results = [];
const errors = [];
window.addEventListener('error', (e) => errors.push('window.error: ' + e.message));
window.addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + e.reason));
const log = (m) => { hud.textContent += m + '\n'; };
const check = (name, ok, detail = '') => {
  results.push({ name, ok: !!ok, detail });
  log(`${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? '  — ' + detail : ''}`);
};
const skip = (name, why) => {
  results.push({ name, ok: true, skipped: true, detail: why });
  log(`SKIP  ${name}  — ${why}`);
};
/** Cadence reelle de requestAnimationFrame, mesuree sur ~0,4 s. */
const rafRate = () => new Promise((resolve) => {
  let n = 0; const t0 = performance.now();
  const loop = () => {
    n++;
    if (performance.now() - t0 < 400) requestAnimationFrame(loop);
    else resolve(n / ((performance.now() - t0) / 1000));
  };
  requestAnimationFrame(loop);
  setTimeout(() => resolve(n / 0.4), 1200);
});
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

// ?model=/assets/avatar/xxx.glb permet de valider un GLB candidat sans
// toucher au modele servi par defaut a l'application.
const PARAMS = new URLSearchParams(location.search);
const MODEL = PARAMS.get('model')
  || (PARAMS.get('avatar')
    ? (await import('../js/avatar/avatar_source.js'))
      .resolveAvatarUrl(PARAMS.get('avatar'))
    : undefined);
const a = new JarvisAvatar3D(document.getElementById('c'), {
  quality: 'high', fallbackEl: document.getElementById('fb'), modelUrl: MODEL,
});
log('modele : ' + (MODEL || '(defaut)'));
window.__avatar3d = a;

(async () => {
  const t0 = performance.now();
  const ok = await a.mount();
  check('chargement', ok, `${Math.round(performance.now() - t0)} ms`);
  if (!ok) { finish(); return; }

  const m = a.engine.model;
  check('IBL présent', !!a.engine.scene.environment);
  check('morph targets', a.engine.model.morphNames().length > 20,
    a.engine.model.morphNames().length + ' morphs');
  const visemes = ['viseme_A','viseme_E','viseme_I','viseme_O','viseme_U',
    'viseme_MBP','viseme_FV','viseme_L','viseme_REST'];
  const names = new Set(m.morphNames());
  check('visèmes TTS complets', visemes.every((v) => names.has(v)),
    visemes.filter((v) => !names.has(v)).join(',') || 'tous présents');
  check('os des yeux', !!m.bone('eye_L') && !!m.bone('eye_R'));
  check('matériaux FrontSide', m.meshes.every((x) => {
    const l = Array.isArray(x.material) ? x.material : [x.material];
    return l.every((mm) => !mm || mm.side === 0);
  }));

  for (const s of ['IDLE','LISTENING','THINKING','SPEAKING','SUCCESS','WARNING','ERROR']) {
    a.setState(s); await wait(120);
    check('état ' + s, a.state === s, a.state);
  }

  check('setEmotion', a.setEmotion('pleased') && a.engine.emotion === 'pleased');
  check('setEmotion invalide rejeté', a.setEmotion('licorne') === false);
  a.setState('SPEAKING'); a.setAudioLevel(0.7); await wait(200);
  check('setAudioLevel', a.setAudioLevel(0.5) === true);
  check('lookAt', a.lookAt('brain') === true);
  check('état inconnu → IDLE', (a.setState('NIMPORTEQUOI'), a.state === 'IDLE'));

  a.setState('SPEAKING'); await wait(150);
  check('reset()', a.reset() && a.state === 'IDLE' && a.engine.emotion === 'neutral');

  // resize
  document.getElementById('c').style.width = '640px'; await wait(300);
  check('resize', a.engine.camera.aspect > 0 && Number.isFinite(a.engine.camera.aspect),
    a.engine.camera.aspect.toFixed(3));
  document.getElementById('c').style.width = '100vw'; await wait(200);

  // --- mixer : combien d'actions EVALUEES, et non instanciees ---
  // On fait avancer mixer + controleur a la main : le rendu se met en pause
  // quand l'onglet est masque, et le nettoyage des actions n'aurait alors
  // jamais lieu pendant le test.
  const step = (n) => {
    for (let i = 0; i < n; i++) {
      a.engine.mixer.update(0.05);
      a.engine.animation.update(0.05);
    }
  };
  a.setState('IDLE');
  step(40);
  const mix = a.engine.animation.inspect(a.engine.mixer);
  window.__mixer = mix;
  check('mixer IDLE : une seule action active', mix.activeCount === 1,
    `${mix.activeCount} actives sur ${mix.created} instanciees : `
    + mix.active.map((x) => `${x.clip}@${x.weight}`).join(', '));
  a.setState('SPEAKING');
  step(40);
  const mix2 = a.engine.animation.inspect(a.engine.mixer);
  window.__mixerSpeaking = mix2;
  check('mixer SPEAKING <= 2', mix2.activeCount <= 2,
    mix2.active.map((x) => `${x.clip}@${x.weight}`).join(', '));
  a.setState('IDLE'); await wait(400);

  // --- textures de peau reellement embarquees ---
  let maps = 0;
  a.engine.model.meshes.forEach((m) => {
    const mt = Array.isArray(m.material) ? m.material : [m.material];
    mt.forEach((x) => {
      if (!x) return;
      if (x.map) maps++;
      if (x.normalMap) maps++;
      if (x.roughnessMap) maps++;
    });
  });
  check('textures de peau presentes', maps >= 3, maps + ' cartes liees');

  // --- cadrages HOME / CHAT / VOICE ---
  for (const f of ['HOME', 'CHAT', 'VOICE']) {
    const ok = a.setFraming(f);
    const sf = a.safeFrame(f);
    check('cadrage ' + f, ok && sf.okTop && sf.okBottom,
      `marge haute ${(sf.marginTop * 100).toFixed(1)}% / basse `
      + `${(sf.marginBottom * 100).toFixed(1)}%, fov ${sf.halfHeight}`);
  }
  a.setFraming('CHAT');

  // --- endurance : plusieurs cycles d'etats, sans dependre du rendu ---
  const CYCLE = ['IDLE', 'LISTENING', 'THINKING', 'SPEAKING', 'IDLE',
    'RECALLING', 'THINKING', 'SPEAKING', 'IDLE'];
  const actionsBefore = a.engine.mixer._actions.length;
  for (let round = 0; round < 6; round++) {
    for (const st of CYCLE) {
      a.setState(st);
      step(12);
    }
  }
  a.setState('IDLE');
  step(60);
  const endur = a.engine.animation.inspect(a.engine.mixer);
  window.__endurance = endur;
  check('endurance : 1 seule base apres 54 transitions',
    endur.activeCount === 1 && !endur.active[0].additive,
    endur.active.map((x) => `${x.clip}@${x.weight}`).join(', '));
  check('aucune AnimationAction creee en trop',
    a.engine.mixer._actions.length === actionsBefore,
    `${actionsBefore} -> ${a.engine.mixer._actions.length}`);
  check('aucun timer de nettoyage orphelin',
    a.engine.animation._retiring.size === 0,
    a.engine.animation._retiring.size + ' en attente');

  // --- clignement : irregulier, donc jamais deux intervalles identiques ---
  const blinks = [];
  let wasClosed = false;
  for (let i = 0; i < 3000; i++) {
    a.engine.behavior.update(0.02);
    const closed = a.engine.model.getMorph('blinkLeft') > 0.5;
    if (closed && !wasClosed) blinks.push(i * 0.02);
    wasClosed = closed;
  }
  const gaps = blinks.slice(1).map((t, i) => +(t - blinks[i]).toFixed(2));
  const uniq = new Set(gaps).size;
  check('clignement non periodique', blinks.length >= 3 && uniq > 1,
    `${blinks.length} clignements, intervalles ${gaps.slice(0, 6).join('/')} s`);

  // FPS sur une fenêtre stable
  // --- FPS : mesurable seulement si requestAnimationFrame tourne ---
  // Dans une pane masquee, `document.hidden` est vrai et rAF ne se declenche
  // quasiment jamais : mesurer donnerait un chiffre faux. On constate la
  // cadence reelle et, si elle est nulle, on marque SKIP avec la preuve
  // plutot que FAIL — ce n'est pas un defaut du produit.
  await wait(2500);
  const rate = await rafRate();
  if (document.hidden || rate < 5) {
    skip('fps mesuré',
      `requestAnimationFrame à ${rate.toFixed(1)}/s, document.hidden=`
      + `${document.hidden} : fenêtre non visible, mesure impossible. `
      + 'Utiliser JarvisAvatar3DInstance.profile() au premier plan.');
  } else {
    check('fps mesuré', a.engine.fps > 0,
      a.engine.fps + ' fps @ ' + a.engine.quality + ` (rAF ${rate.toFixed(0)}/s)`);
  }
  // `rendering` est FAUX quand la fenetre est masquee : c'est la pause de
  // rendu voulue depuis la Phase 1, pas un defaut. On ne peut donc l'affirmer
  // que dans une fenetre visible.
  if (document.hidden) {
    skip('rendu actif',
      'document.hidden=true : la pause de rendu est active, comportement attendu');
  } else {
    check('rendu actif', a.engine.rendering === true);
  }

  // perte de contexte WebGL
  const ext = a.engine.renderer.getContext().getExtension('WEBGL_lose_context');
  if (ext) {
    ext.loseContext(); await wait(400);
    check('perte contexte gérée', a.engine.contextLost === true
      && a.engine.rendering === false);
    ext.restoreContext(); await wait(900);
    check('contexte restauré', a.engine.contextLost === false
      && !!a.engine.scene.environment);
  } else check('perte contexte gérée', false, 'extension indisponible');

  finish();
})();

function finish() {
  check('aucune erreur console', errors.length === 0, errors.join(' | '));
  const failed = results.filter((r) => !r.ok);
  const skipped = results.filter((r) => r.skipped);
  log(`
=== ${results.length - failed.length - skipped.length}/${results.length} PASS, ${skipped.length} SKIP, ${failed.length} FAIL ===`);
  window.__testResults = { results, failed: failed.length,
    skipped: skipped.length, errors };
  window.__testDone = true;
}
</script>
</body></html>
