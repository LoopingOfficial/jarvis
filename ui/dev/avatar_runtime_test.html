<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#000;overflow:hidden">
<canvas id="c" style="width:100vw;height:100vh"></canvas>
<div id="hud" style="position:fixed;top:10px;right:10px;background:#111;color:#0f0;font:12px monospace;padding:10px;border-radius:6px;z-index:10"></div>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}
</script>
<script type="module">
import { JarvisAvatar } from '../js/avatar/avatar.js';
const hud = document.getElementById('hud');
const log = (m) => { hud.textContent += m + '\n'; console.log('[runtime]', m); };

try {
  const avatar = new JarvisAvatar({
    canvas: document.getElementById('c'),
    quality: 'balanced',
    modelUrl: '/assets/avatar/jarvis_avatar.glb',
    onReady: (a) => {
      const r = a.model;
      log('READY');
      log('bones: ' + (r?.bones?.size || 'none'));
      log('meshes: ' + (r?.meshes?.length || 'none'));
      log('morphs: ' + (r?.morphMeshes?.length || 'none'));
      log('meta keys: ' + Object.keys(r?.userData?.jarvis || {}));
      log('clips: ' + (a.locomotion?.availableClips?.length || a.model?.actions?.length || 'none'));
      document.title = 'RUNTIME_OK';
      window.__REPORT = { ok: true, bones: r?.bones?.size };
    },
    onError: (e) => { log('ERROR: ' + e.message); document.title = 'RUNTIME_ERR'; window.__REPORT = { error: e.message }; }
  });
  log('Constructor OK');
  log('Canvas: ' + !!document.getElementById('c'));
} catch(e) {
  log('THROW: ' + e.message);
  document.title = 'RUNTIME_THROW';
}
</script>
</body></html>
