<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>JARVIS — scène avatar autonome</title>
<style>
  html, body { margin: 0; height: 100%; background: #050a14; color: #d7e3f0;
    font: 12px ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 250px; }
  #stageBox { position: relative; }
  #stage { width: 100%; height: 100%; display: block; }
  #panel { background: #070d19; border-left: 1px solid rgba(56,142,190,.2);
    padding: 10px; overflow: auto; display: grid; gap: 4px; align-content: start; }
  button { background: rgba(12,22,40,.9); color: #d7e3f0;
    border: 1px solid rgba(56,142,190,.3); border-radius: 7px; padding: 4px 8px;
    cursor: pointer; font-size: 11px; text-align: left; }
  button:hover { border-color: #22d3ee; }
  h4 { margin: 8px 0 2px; font-size: 9px; letter-spacing: 1.4px; color: #22d3ee; }
  #hud { position: absolute; left: 10px; top: 10px; background: rgba(8,15,28,.85);
    border: 1px solid rgba(56,142,190,.25); border-radius: 9px; padding: 8px 10px;
    line-height: 1.6; }
  #hud b { color: #22d3ee; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stageBox"><canvas id="stage"></canvas><div id="hud">chargement…</div></div>
  <div id="panel"></div>
</div>
<script type="module">
import { JarvisAvatar } from '../js/avatar/avatar.js';

const avatar = new JarvisAvatar({
  canvas: document.getElementById('stage'),
  quality: 'balanced',
  modelUrl: '/assets/avatar/jarvis.glb?v=' + Date.now(),
  onReady: (a) => {
    window.JarvisAvatar = a;
    hud();
    buildPanel(a);
    window.__ready = true;
  },
  onError: (err) => {
    document.getElementById('hud').textContent = 'ERREUR : ' + err.message;
    window.__error = String(err && err.stack || err);
  },
});
window.JarvisAvatar = avatar;

function hud() {
  const a = window.JarvisAvatar;
  setInterval(() => {
    document.getElementById('hud').innerHTML =
      `<b>état</b> ${a.state} · <b>fps</b> ${a.fps}<br>` +
      `<b>clip</b> ${a.locomotion?.baseName || '—'} · <b>geste</b> ${a.gestures?.playing || '—'}<br>` +
      `<b>caméra</b> ${a.director?.mode} · <b>qualité</b> ${a.quality}<br>` +
      `<b>position</b> ${a.avatarRoot.position.x.toFixed(2)}, ${a.avatarRoot.position.z.toFixed(2)}`;
  }, 250);
}

function buildPanel(a) {
  const panel = document.getElementById('panel');
  const add = (label, fn) => {
    const b = document.createElement('button');
    b.textContent = label; b.onclick = fn; panel.appendChild(b);
  };
  const title = (t) => { const h = document.createElement('h4'); h.textContent = t; panel.appendChild(h); };

  title('cadrage');
  ['CALL', 'PORTRAIT', 'HALF_BODY', 'FULL_BODY', 'FOCUS', 'BRAIN_VIEW']
    .forEach((m) => add(m, () => a.setCameraMode(m)));
  title('états');
  ['IDLE', 'LISTENING', 'THINKING', 'RECALLING', 'ACTING', 'SPEAKING', 'SUCCESS', 'ERROR']
    .forEach((s) => add(s, () => a.setState(s)));
  title('gestes');
  ['explain', 'open_hand', 'point', 'acknowledge', 'agree', 'disagree', 'thinking',
    'success', 'concern', 'welcome', 'question', 'wait', 'reassure', 'arms_cross']
    .forEach((g) => add(g, () => a.gesture({ gesture: g, intensity: 0.8 })));
  title('déplacement');
  a.stage.names().forEach((p) => add('→ ' + p, () => a.moveTo(p)));
  title('parole');
  add('parler (FR)', () => a.speak(
    "Bonjour Jérôme. J'ai vérifié ton serveur de production : tout fonctionne. "
    + "Veux-tu que je regarde les sauvegardes ?", { duration: 6 }));
  add('stop (barge-in)', () => a.stopSpeaking({ bargeIn: true }));
}
</script>
<script src="/dev/avatar_suite.js"></script>
</body>
</html>
